- name: Sansheets
  description: 'A Google Sheets plugin that exposes Santiment metric data directly
    inside spreadsheets using simple sheet functions. Requires a Santiment API key
    and a Sanbase subscription. Ideal for analysts who prefer spreadsheet workflows
    over code-based integrations.

