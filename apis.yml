name: Santiment
description: 'Santiment is a crypto market intelligence platform providing REST and
  GraphQL APIs for accessing on-chain metrics, social sentiment data, developer activity,
  and blockchain analytics signals. SanAPI covers 2,800+ crypto assets across 14 blockchain
  networks and offers more than 1,000 metrics including daily active addresses, MVRV
  ratio, social sentiment scores, Twitter follower counts, trending topics, developer
  commit activity, and labeled address intelligence spanning 75+ million Ethereum
  addresses and 65+ million Bitcoin addresses. Data is available via a GraphQL endpoint,
  a Python SDK (sanpy), S3 parquet exports, and a Google Sheets plugin.

  '
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Crypto
- Blockchain
- Market Intelligence
- On-Chain Metrics
- Social Sentiment
- Developer Activity
- Analytics
- GraphQL
