apis:
- name: SanAPI
  description: 'The primary Santiment GraphQL API giving developers programmatic access
    to on-chain metrics, social sentiment, developer activity, and price data for
    2,800+ crypto assets. Supports timeseries queries with customisable intervals,
    multi-asset batch requests, built-in transforms (moving averages, consecutive
    differences), trending words/stories, and complex project filtering by watchlist
    or metric threshold. Authentication is via an API key passed as a Bearer token.
    Rate limits are enforced per minute, per hour, and per month; limits and historical
    data depth vary by subscription plan.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.santiment.net/
  baseURL: https://api.santiment.net/graphql
